# Add ONLY after generating local certs with ./scripts/make-local-cert.sh
services:
  nginx-tls:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8443:443"
    depends_on:
      apache:
        condition: service_healthy
    volumes:
      - ./nginx/site:/usr/share/nginx/html:ro
      - ./nginx/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/common.inc:/etc/nginx/conf.d/common.inc:ro
      - ./certs:/etc/nginx/certs:ro
    security_opt:
      - no-new-privileges:true
