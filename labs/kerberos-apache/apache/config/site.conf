ServerName web.lab.test
ServerTokens Prod
ServerSignature Off
TraceEnable Off
SSLProtocol -all +TLSv1.2 +TLSv1.3
Header always set X-Content-Type-Options "nosniff"
LogFormat "%v %h %u %t \"%r\" %>s %b" lab
ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 lab

<Directory /var/www/lab>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<VirtualHost *:443>
    ServerName web.lab.test
    DocumentRoot /var/www/lab/web
    SSLEngine On
    SSLCertificateFile /run/tls/web.crt
    SSLCertificateKeyFile /run/tls/web.key

    <Location /private/>
        Include /etc/apache2/lab/gssapi.inc
        Require valid-user
    </Location>

    <Location /admin/>
        Include /etc/apache2/lab/gssapi.inc
        Require user alice@LAB.TEST
        AuthzSendForbiddenOnFailure On
    </Location>
</VirtualHost>

<VirtualHost *:443>
    ServerName public.lab.test
    DocumentRoot /var/www/lab/public
    SSLEngine On
    SSLCertificateFile /run/tls/web.crt
    SSLCertificateKeyFile /run/tls/web.key
</VirtualHost>
