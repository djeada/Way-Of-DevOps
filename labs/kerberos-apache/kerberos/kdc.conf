[kdcdefaults]
    kdc_ports = 88
    kdc_tcp_ports = 88

[realms]
    LAB.TEST = {
        database_name = /var/lib/krb5kdc/principal
        key_stash_file = /var/lib/krb5kdc/stash
        max_life = 1h
        max_renewable_life = 8h
        default_principal_flags = +preauth
    }

[logging]
    kdc = FILE:/dev/stdout
