[libdefaults]
    default_realm = LAB.TEST
    dns_lookup_realm = false
    dns_lookup_kdc = false
    dns_canonicalize_hostname = false
    rdns = false
    forwardable = false
    ticket_lifetime = 1h
    renew_lifetime = 8h
    default_ccache_name = FILE:/tmp/krb5cc_%{uid}
    udp_preference_limit = 1

[realms]
    LAB.TEST = {
        kdc = kdc.lab.test
    }

[domain_realm]
    .lab.test = LAB.TEST
    lab.test = LAB.TEST
